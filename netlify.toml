[build]
  publish = "public"
  functions = "netlify/functions"
  command = "npm install"

# Rute dengan parameter path (:id, :tesId, :sesiId) dipetakan lebih dulu
# (urutan penting — Netlify mencocokkan dari atas ke bawah).

[[redirects]]
  from = "/api/admin/users/:id"
  to = "/.netlify/functions/admin-users"
  status = 200
[[redirects]]
  from = "/api/admin/users"
  to = "/.netlify/functions/admin-users"
  status = 200

[[redirects]]
  from = "/api/admin/kelas/:id"
  to = "/.netlify/functions/admin-kelas"
  status = 200
[[redirects]]
  from = "/api/admin/kelas"
  to = "/.netlify/functions/admin-kelas"
  status = 200

[[redirects]]
  from = "/api/admin/mapel/:id"
  to = "/.netlify/functions/admin-mapel"
  status = 200
[[redirects]]
  from = "/api/admin/mapel"
  to = "/.netlify/functions/admin-mapel"
  status = 200

